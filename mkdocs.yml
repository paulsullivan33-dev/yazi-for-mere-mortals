site_name: Yazi for Mere Mortals
site_description: A terminal file manager that shows three panes at once — where you are, what is here, and what the hovered file contains. Moving at keyboard speed, copying, renaming and deleting with a safety net, previews before you open anything, and plain-text files for every setting, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/yazi-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text CC BY 4.0, code MIT'

